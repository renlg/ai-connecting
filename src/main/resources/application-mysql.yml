# ============================================================
# MySQL 可选配置：通过 SPRING_PROFILES_ACTIVE=mysql 激活本 profile，覆盖 application.yml 中的 SQLite 默认配置。
# 未激活 mysql profile 时，本文件完全不生效，行为与单实例 SQLite 部署完全一致。
# 供未来多实例部署使用；schema 由 schema-mysql.sql 在启动时建表，因此 ddl-auto 为 validate。
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:ai_connecting}?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:4}
      connection-test-query: "SELECT 1"
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
